<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Mãos que Ajudam</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- =========================
         CABEÇALHO E NAVEGAÇÃO
    ========================== -->

    <header>
        <h1>Cadastro - Mãos que Ajudam</h1>
        <p>Preencha seus dados para participar das nossas ações.</p>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>


    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <main>

        <section>
            <h2>Formulário de cadastro</h2>

            <form id="form-cadastro" novalidate>

                <!-- DADOS PESSOAIS -->

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <p>
                        <label for="nome">Nome:</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            required
                        >
                    </p>

                    <p>
                        <label for="email">E-mail:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </p>

                    <p>
                        <label for="cpf">CPF:</label>
                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                            placeholder="000.000.000-00"
                            required
                        >
                    </p>

                    <p>
                        <label for="telefone">Telefone:</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                            placeholder="(11) 99999-9999"
                            required
                        >
                    </p>

                    <p>
                        <label for="cep">CEP:</label>
                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            pattern="[0-9]{5}-[0-9]{3}"
                            placeholder="00000-000"
                            required
                        >
                    </p>
                </fieldset>


                <!-- PARTICIPAÇÃO -->

                <fieldset>
                    <legend>Participação</legend>

                    <p>
                        <label for="interesse">Como deseja ajudar?</label>

                        <select id="interesse" name="interesse" required>
                            <option value="">Selecione uma opção</option>
                            <option value="voluntariado">Trabalho voluntário</option>
                            <option value="doacao">Realizar uma doação</option>
                            <option value="outros">Outras formas de ajuda</option>
                        </select>
                    </p>

                    <p>
                        <label for="mensagem">Mensagem:</label><br>

                        <textarea
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            cols="40"
                        ></textarea>
                    </p>
                </fieldset>


                <!-- ENVIO DO FORMULÁRIO -->

                <p>
                    <button type="submit">Enviar cadastro</button>
                </p>

                <p id="mensagem-form"></p>

            </form>

        </section>

    </main>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>
        <p>&copy; 2026 Mãos que Ajudam</p>
    </footer>


    <!-- =========================
         SCRIPTS
    ========================== -->

    <!-- Biblioteca externa SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JavaScript principal do projeto -->
    <script type="module" src="../js/app.js"></script>

</body>

</html>
